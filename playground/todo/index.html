<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List</title>
  <link rel="icon" href="../../assets/favicons/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="../../assets/favicons/favicon.ico" />
  <meta name="description" content="A todo list with filters and saved tasks. Built with jQuery and CSS." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/app.css" />
  <link rel="stylesheet" href="assets/css/todos.css" />
  <script src="../shared/app.js"></script>
</head>
<body data-app-title="Todo List">
  <main class="todo">
    <header class="todo-head">
      <h1>Today</h1>
      <p id="summary" aria-live="polite"></p>
    </header>

    <form id="add" class="add" autocomplete="off">
      <label class="sr-only" for="new-todo">New task</label>
      <input id="new-todo" type="text" placeholder="What needs doing?" maxlength="140" />
      <button class="btn primary" type="submit">Add</button>
    </form>

    <div class="toolbar">
      <div class="segmented" id="filters" role="group" aria-label="Filter tasks">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" data-filter="done" aria-pressed="false">Done</button>
      </div>
      <button type="button" class="link" id="clear">Clear completed</button>
    </div>

    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden>Nothing here yet.</p>
  </main>

  <script src="assets/js/lib/jquery-3.5.0.min.js"></script>
  <script src="assets/js/todos.js"></script>
</body>
</html>
